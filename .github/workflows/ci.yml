name: SYNAX 3D Agent Office & Turkish LLM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run SYNAX-LLM & 3D Agent Office Unit Tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
